name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Verify
        run: make verify

  release:
    needs: [verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            conventional-changelog-conventionalcommits@9.3.1
            @semantic-release/exec@7.1.0
            @semantic-release/git@10.0.1
            @semantic-release/github@12.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Set up Homebrew
        if: ${{ steps.release.outputs.new_release_published == 'true' }}
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91 # main
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          brew-gh-api-token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update Homebrew cask
        if: ${{ steps.release.outputs.new_release_published == 'true' }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          brew tap altaywtf/tap
          tap_repo="$(brew --repo altaywtf/tap)"
          git -C "$tap_repo" config user.name "github-actions[bot]"
          git -C "$tap_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap_repo" remote set-url origin "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/altaywtf/homebrew-tap.git"
          brew bump-cask-pr --write-only --commit --no-audit --no-style --version "$VERSION" altaywtf/tap/endelito
          git -C "$tap_repo" push origin HEAD:main
