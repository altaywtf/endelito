name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    timeout-minutes: 15
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify
        run: make verify

      - name: Smoke live
        run: make smoke-live

  release:
    needs: [verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    timeout-minutes: 105
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    outputs:
      release_ready: ${{ steps.finalized.outputs.ready }}
      release_version: ${{ steps.release-target.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Import signing assets
        id: signing
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
        run: scripts/import-signing-assets.sh

      # Mint after signing-asset import so the ~1h installation token is not
      # burned before authenticated release writes.
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: uinaf
          repositories: |
            endelito
            homebrew-tap
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Authorize release writes
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: gh auth setup-git

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            conventional-changelog-conventionalcommits@9.3.1
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.9
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.codesign_identity }}
          NOTARY_API_KEY_PATH: ${{ steps.signing.outputs.notary_api_key_path }}
          NOTARY_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ vars.APPLE_NOTARY_API_ISSUER_ID }}

      - name: Resolve release target
        id: release-target
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          NEW_RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          tag="$NEW_RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            draft_tags="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[] | select(.draft) | .tag_name' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
            )"
            draft_count="$(printf '%s\n' "$draft_tags" | awk 'NF { count++ } END { print count + 0 }')"
            if (( draft_count > 1 )); then
              echo "multiple draft releases require maintainer resolution" >&2
              exit 1
            fi
            if (( draft_count == 1 )); then
              tag="$(printf '%s\n' "$draft_tags" | awk 'NF { print; exit }')"
            else
              while IFS= read -r candidate; do
                candidate_commit="$(git rev-parse "${candidate}^{commit}")"
                candidate_parent="$(git rev-parse "${candidate}^{commit}^" 2>/dev/null || true)"
                if [[ "$candidate_commit" == "$GITHUB_SHA" || "$candidate_parent" == "$GITHUB_SHA" ]]; then
                  tag="$candidate"
                  break
                fi
              done < <(git tag --merged origin/main --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            fi
          fi
          if [[ -z "$tag" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported release tag: $tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "release tag is not on origin/main: $tag" >&2
            exit 1
          fi
          is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "present=true"
            echo "published=$([[ "$is_draft" == "false" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify draft asset manifest
        if: steps.release-target.outputs.present == 'true' && steps.release-target.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: |
          set -euo pipefail
          asset_count="$(
            gh release view "$RELEASE_TAG" --json assets \
              --jq '[.assets[].name | select(test("^endelito-[0-9]+\\.[0-9]+\\.[0-9]+-macos-[^.]+\\.zip$"))] | length'
          )"
          if [[ "$asset_count" != "1" ]]; then
            echo "expected exactly one notarized Endelito zip, found $asset_count" >&2
            exit 1
          fi

      - name: Publish verified draft
        if: steps.release-target.outputs.present == 'true' && steps.release-target.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify immutable release
        if: steps.release-target.outputs.present == 'true'
        id: finalized
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: |
          gh release verify "$RELEASE_TAG"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  update-homebrew-tap:
    if: needs.release.outputs.release_ready == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Create tap bot token
        id: tap-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: uinaf
          repositories: |
            endelito
            homebrew-tap
          permission-contents: write
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uinaf/homebrew-tap
          token: ${{ steps.tap-bot.outputs.token }}
          path: homebrew-tap
          persist-credentials: false
          ref: main
      - name: Prepare cask
        env:
          GH_TOKEN: ${{ steps.tap-bot.outputs.token }}
          VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          set -euo pipefail
          asset="endelito-${VERSION}-macos-arm64.zip"
          gh release download "v${VERSION}" --repo uinaf/endelito --pattern "$asset" --dir "$RUNNER_TEMP"
          sha256="$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')"
          SHA256="$sha256" ruby -e '
            path = ARGV.fetch(0)
            text = File.read(path)
            text.sub!(/version "[^"]+"/, %(version "#{ENV.fetch("VERSION")}")) or abort "version not found"
            text.sub!(/sha256 "[0-9a-f]+"/, %(sha256 "#{ENV.fetch("SHA256")}")) or abort "sha256 not found"
            File.write(path, text)
          ' homebrew-tap/Casks/endelito.rb
          grep -F "version \"${VERSION}\"" homebrew-tap/Casks/endelito.rb
          grep -F "sha256 \"${sha256}\"" homebrew-tap/Casks/endelito.rb
      - name: Commit cask
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "endelito ${{ needs.release.outputs.release_version }}"
          repo: uinaf/homebrew-tap
          branch: main
          file_pattern: Casks/endelito.rb
          repository: homebrew-tap
        env:
          GITHUB_TOKEN: ${{ steps.tap-bot.outputs.token }}

  sync-released-version:
    if: needs.release.outputs.release_ready == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Prepare released version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
        run: printf '%s\n' "$RELEASE_VERSION" > VERSION
      - name: Commit released version
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "chore(release): ${{ needs.release.outputs.release_version }} [skip ci]"
          repo: ${{ github.repository }}
          branch: main
          file_pattern: VERSION
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
